; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ESP32_OTA]
extends = env:ESP32
upload_protocol = espota
upload_port = 192.168.251.30
;upload_port = ESP32_Tempa.local
upload_flags =
  --auth=Corail2025

[env:ESP32]
platform = espressif32
board = upesy_wroom

[env:ESP32_C6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
;upload_port = COM11
;monitor_port = COM11


[env:ESP32_S3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env]

framework = arduino

board_build.partitions = src/partitions.csv

upload_speed = 921600
monitor_speed = 115200
monitor_eol = CRLF
monitor_filters = esp32_exception_decoder


;upload_port = 192.168.254.1
;upload_flags =
;    --auth=Corail2025
;   --progress

;lib_ldf_mode = chain+

build_flags = 
  -Wl,-Map,firmware.map

lib_deps =
  bblanchon/ArduinoJson
  ClosedCube/ClosedCube HDC1080 @ ^1.1.1
  ESP32Async/AsyncTCP 
  ESP32Async/ESPAsyncWebServer
  https://github.com/br3ttb/Arduino-PID-Library.git
  adafruit/DHT sensor library @ ^1.4.3
  https://github.com/gilmaimon/ArduinoWebsockets.git
